[project]
name = "faultline-agent-harness"
version = "0.1.0"
description = "Faultline agent harness: Claude model loop + browser-facing API (Modal app faultline-harness)"
requires-python = ">=3.11"
dependencies = [
    "anthropic==1.5.0",
    "fastapi>=0.115",
    "fastmcp==4.0.3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "modal==1.5.5",
    "faultline-common",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "anyio>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
