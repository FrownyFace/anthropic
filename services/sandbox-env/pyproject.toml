[project]
name = "faultline-sandbox-env"
version = "0.1.0"
description = "Faultline gym + MCP tool server: episodes, fault injection, grading"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pydantic==2.13.5",
  "fastmcp==4.0.3",
  "httpx==0.28.1",
  "modal==1.5.5",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "anyio==4.11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sandbox_env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
