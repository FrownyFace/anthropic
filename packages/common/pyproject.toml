[project]
name = "faultline-common"
version = "0.1.0"
description = "Shared contracts + unified logging for Faultline services"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faultline_common"]
